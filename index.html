<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Turnos Médicos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col"></div>

    <script>
        const state = {
            usuarioActual: null,
            medicoSeleccionado: null,
            medicos: [
                { id: 1, nombre: "Dr. Roberto Gómez", especialidad: "Cardiología", matricula: "M.P. 3421", horario: "08:00 - 13:00", avatar: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80" },
                { id: 2, nombre: "Dra. María Laura Juárez", especialidad: "Pediatría", matricula: "M.P. 4105", horario: "14:00 - 19:00", avatar: "https://images.unsplash.com/photo-1594824813566-78853a8019e1?w=150&auto=format&fit=crop&q=80" },
                { id: 3, nombre: "Dr. Carlos Santillán", especialidad: "Traumatología", matricula: "M.P. 2890", horario: "09:00 - 16:00", avatar: "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=150&auto=format&fit=crop&q=80" },
                { id: 4, nombre: "Dra. Ana Florencia Silva", especialidad: "Dermatología", matricula: "M.P. 5120", horario: "08:00 - 12:00", avatar: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=150&auto=format&fit=crop&q=80" }
            ],
            turnos: [],
            modalTurnoAbierto: false,
            filtroMedicoHistorial: "todos"
        };

        function render() {
            const app = document.getElementById('app');
            if (!state.usuarioActual) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderDashboard();
            }
            if (window.lucide) {
                setTimeout(() => lucide.createIcons(), 50);
            }
        }

        function renderLogin() {
            return `
            <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
                    <div class="text-center mb-6">
                        <h1 class="text-2xl font-bold text-slate-800">Consultorio Privado</h1>
                        <p class="text-slate-500 text-sm mt-1">Acceso para Recepción / Secretaría</p>
                    </div>
                    <form onsubmit="ingresar(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Usuario</label>
                            <input type="text" id="usuario" value="secretaria" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                            <input type="password" id="password" value="1234" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 outline-none focus:ring-2 focus:ring-teal-500">
                        </div>
                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 rounded-lg transition">Ingresar al Sistema</button>
                    </form>
                </div>
            </div>
            `;
        }

        function renderDashboard() {
            return `
            <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm p-4 flex justify-between items-center">
                <h1 class="font-bold text-slate-800 text-lg">Centro Médico San Martín</h1>
                <button onclick="cerrarSesion()" class="text-sm text-red-600 font-semibold">Cerrar Sesión</button>
            </header>

            <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-8 w-full">
                <section>
                    <h2 class="text-xl font-bold text-slate-800 mb-4">Médicos Disponibles</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${state.medicos.map(m => `
                            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                <h3 class="font-bold text-slate-800">${m.nombre}</h3>
                                <p class="text-teal-600 text-sm font-medium">${m.especialidad}</p>
                                <p class="text-slate-400 text-xs mt-1">${m.horario}</p>
                                <button onclick="abrirModal(${m.id})" class="mt-4 w-full bg-slate-900 text-white text-sm font-semibold py-2 rounded-lg">Agendar Turno</button>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section class="bg-white rounded-xl border border-slate-200 p-4">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">Agenda de Turnos</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 uppercase border-b">
                                    <th class="p-3">Hora</th>
                                    <th class="p-3">Paciente</th>
                                    <th class="p-3">DNI</th>
                                    <th class="p-3">Médico</th>
                                    <th class="p-3">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${state.turnos.length === 0 ? `
                                    <tr><td colspan="5" class="p-4 text-center text-slate-400">No hay turnos agendados aún.</td></tr>
                                ` : state.turnos.map(t => `
                                    <tr class="border-b">
                                        <td class="p-3 font-bold">${t.hora}</td>
                                        <td class="p-3">${t.paciente} (${t.edad} yrs, B° ${t.barrio})</td>
                                        <td class="p-3">${t.dni}</td>
                                        <td class="p-3">${t.medico}</td>
                                        <td class="p-3"><span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded">${t.estado}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>

            ${state.modalTurnoAbierto ? renderModal() : ''}
            `;
        }

        function renderModal() {
            const m = state.medicoSeleccionado;
            return `
            <div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                    <h3 class="text-lg font-bold text-slate-800 mb-1">Nuevo Turno</h3>
                    <p class="text-slate-500 text-xs mb-4">Atención con ${m.nombre}</p>
                    <form onsubmit="guardarTurno(event)" class="space-y-3">
                        <input type="text" id="paciente" placeholder="Nombre y Apellido *" required class="w-full p-2 border rounded-lg text-sm">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="dni" placeholder="DNI *" required class="w-full p-2 border rounded-lg text-sm">
                            <input type="date" id="fechaNac" required onchange="calcularEdad(this.value)" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="edad" placeholder="Edad" readonly class="w-full p-2 border rounded-lg text-sm bg-slate-50">
                            <select id="sexo" required class="w-full p-2 border rounded-lg text-sm bg-white">
                                <option value="">Sexo...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                            </select>
                        </div>
                        <input type="text" id="barrio" placeholder="Barrio *" required class="w-full p-2 border rounded-lg text-sm">
                        <input type="text" id="obraSocial" placeholder="Obra Social / Prepaga" class="w-full p-2 border rounded-lg text-sm">
                        <input type="datetime-local" id="fechaHora" required class="w-full p-2 border rounded-lg text-sm">
                        <div class="flex justify-end gap-2 pt-3">
                            <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-slate-500 text-sm">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-teal-600 text-white rounded-lg font-semibold text-sm">Guardar Turno</button>
                        </div>
                    </form>
                </div>
            </div>
            `;
        }

        function ingresar(e) {
            e.preventDefault();
            state.usuarioActual = { usuario: 'secretaria' };
            render();
        }

        function cerrarSesion() {
            state.usuarioActual = null;
            render();
        }

        function abrirModal(medicoId) {
            state.medicoSeleccionado = state.medicos.find(m => m.id === medicoId);
            state.modalTurnoAbierto = true;
            render();
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('fechaHora').value = now.toISOString().slice(0, 16);
        }

        function cerrarModal() {
            state.modalTurnoAbierto = false;
            render();
        }

        function calcularEdad(fechaNacStr) {
            if (!fechaNacStr) return;
            const hoy = new Date();
            const nac = new Date(fechaNacStr);
            let edad = hoy.getFullYear() - nac.getFullYear();
            const m = hoy.getMonth() - nac.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
            document.getElementById('edad').value = edad >= 0 ? edad : 0;
        }

        function guardarTurno(e) {
            e.preventDefault();
            const hora = new Date(document.getElementById('fechaHora').value).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            state.turnos.unshift({
                hora: hora + ' hs',
                paciente: document.getElementById('paciente').value,
                dni: document.getElementById('dni').value,
                edad: document.getElementById('edad').value,
                barrio: document.getElementById('barrio').value,
                medico: state.medicoSeleccionado.nombre,
                estado: 'En espera'
            });
            cerrarModal();
        }

        // Ejecución inicial
        window.onload = render;
    </script>
</body>
</html>
