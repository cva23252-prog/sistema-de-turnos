<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Médica SaaS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <div id="app" class="flex-grow flex flex-col"></div>

    <script>
        // --- CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = 'https://bbokctujmmrtpaweslmf.supabase.co';
        const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJib2tjdHVqbW1ydHBhd2VzbG1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MDczNDMsImV4cCI6MjEwODI4MzM0M30.nFYHYtsR-78yUn-C-LADOh_8z318ewcwdxBgOO0rwFc';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const BLOQUES_HORARIOS = [
            "08:00", "09:00", "10:00", "11:00",
            "18:00", "19:00", "20:00", "21:00"
        ];

        const state = {
            usuarioActual: null,
            medicos: [],
            turnos: [],
            filtroTexto: '',
            filtroEstado: 'Todos'
        };

        // --- CARGA DE DATOS EN TIEMPO REAL ---
        async function cargarDatosIniciales() {
            await Promise.all([obtenerMedicos(), obtenerTurnos()]);
            renderApp();
        }

        async function obtenerMedicos() {
            const { data, error } = await supabaseClient.from('medicos').select('*').order('nombre');
            if (!error) state.medicos = data || [];
        }

        async function obtenerTurnos() {
            const { data, error } = await supabaseClient.from('turnos').select('*, medicos(nombre, especialidad)').order('fecha', { ascending: true });
            if (!error) state.turnos = data || [];
        }

        // --- FUNCIONALIDADES DE WHATSAPP Y EXPORTACIÓN ---
        function enviarWhatsAppConfirmacion(turnoId) {
            const t = state.turnos.find(x => x.id === turnoId);
            if (!t) return;
            
            const mensaje = `Hola ${t.paciente}, te recordamos tu turno médico el día ${t.fecha} a las ${t.hora} hs con el/la ${t.medicos?.nombre || 'profesional'} (${t.medicos?.especialidad || ''}). Por favor responder este mensaje para confirmar. ¡Gracias!`;
            const url = `https://wa.me/${t.telefono.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function exportarTurnosCSV() {
            if (state.turnos.length === 0) return alert("No hay turnos para exportar.");
            let csvContent = "data:text/csv;charset=utf-8,Fecha,Hora,Paciente,DNI,Telefono,Estado,Medico\n";
            
            state.turnos.forEach(t => {
                csvContent += `${t.fecha},${t.hora},"${t.paciente}",${t.dni},${t.telefono},${t.estado},"${t.medicos?.nombre || ''}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `planila_turnos_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- REGISTRO Y VALIDACIÓN ANTISOLAPAMIENTO ---
        async function registrarMedico(e) {
            e.preventDefault();
            const form = e.target;
            const nuevoMedico = {
                nombre: form.nombre.value,
                especialidad: form.especialidad.value,
                usuario: form.usuario.value,
                clave: form.clave.value
            };

            const { error } = await supabaseClient.from('medicos').insert([nuevoMedico]);
            if (error) {
                alert("Error al crear médico: " + error.message);
            } else {
                alert("✅ Médico registrado con éxito");
                form.reset();
                await obtenerMedicos();
                renderApp();
            }
        }

        async function guardarTurnoNuevo(e) {
            e.preventDefault();
            const form = e.target;
            const medico_id = form.medico_id.value;
            const fecha = form.fecha.value;
            const hora = form.hora.value;

            // Validación de Solapamiento
            const existeSolapamiento = state.turnos.some(t => 
                t.medico_id == medico_id && t.fecha === fecha && t.hora === hora && t.estado !== 'Cancelado'
            );

            if (existeSolapamiento) {
                return alert("⚠️ Error: El médico ya tiene un turno reservado en ese mismo horario.");
            }

            const nuevoTurno = {
                medico_id,
                fecha,
                hora,
                paciente: form.paciente.value,
                dni: form.dni.value,
                telefono: form.telefono.value,
                estado: 'En espera'
            };

            const { error } = await supabaseClient.from('turnos').insert([nuevoTurno]);
            if (error) {
                alert("Error al reservar turno: " + error.message);
            } else {
                alert("✅ Turno asignado con éxito");
                form.reset();
                await obtenerTurnos();
                renderApp();
            }
        }

        // --- CAMBIO DE ESTADO Y FICHA CLÍNICA ---
        async function cambiarEstadoTurno(id, nuevoEstado) {
            const { error } = await supabaseClient.from('turnos').update({ estado: nuevoEstado }).eq('id', id);
            if (!error) {
                await obtenerTurnos();
                renderApp();
            }
        }

        async function guardarNotaConsulta(id) {
            const nota = document.getElementById(`nota-${id}`).value;
            const { error } = await supabaseClient.from('turnos').update({ nota_consulta: nota, estado: 'Atendido' }).eq('id', id);
            if (!error) {
                alert("✅ Historia clínica del turno guardada.");
                await obtenerTurnos();
                renderApp();
            }
        }

        // --- MANEJO DE AUTENTICACIÓN ---
        function loginAdmin(e) {
            e.preventDefault();
            if (e.target.adminUsuario.value === 'admin' && e.target.adminClave.value === 'admin123') {
                state.usuarioActual = { rol: 'admin', nombre: 'Administrador General' };
                renderApp();
            } else { alert("Credenciales incorrectas."); }
        }

        function loginSecretaria(e) {
            e.preventDefault();
            if (e.target.secUsuario.value === 'secretaria' && e.target.secClave.value === '1234') {
                state.usuarioActual = { rol: 'secretaria', nombre: 'Recepción Central' };
                renderApp();
            } else { alert("Credenciales incorrectas."); }
        }

        function loginMedico(e) {
            e.preventDefault();
            const u = e.target.medUsuario.value;
            const c = e.target.medClave.value;
            const med = state.medicos.find(m => m.usuario === u && m.clave === c);
            if (med) {
                state.usuarioActual = { rol: 'medico', ...med };
                renderApp();
            } else { alert("Usuario o clave médica inválidos."); }
        }

        function logout() {
            state.usuarioActual = null;
            renderApp();
        }

        // --- RENDERIZADO DE INTERFAZ GENERAL ---
        function renderApp() {
            const app = document.getElementById('app');
            if (!state.usuarioActual) {
                app.innerHTML = renderLogin();
            } else if (state.usuarioActual.rol === 'admin') {
                app.innerHTML = renderDashboardAdmin();
            } else if (state.usuarioActual.rol === 'secretaria') {
                app.innerHTML = renderDashboardSecretaria();
            } else if (state.usuarioActual.rol === 'medico') {
                app.innerHTML = renderDashboardMedico();
            }
            if (window.lucide) lucide.createIcons();
        }

       // --- COMPONENTE DE LOGIN (SIN AUTOCOMPLETADO NI VALORES SUGERIDOS) ---
function renderLogin() {
    return `
    <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-md w-full p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-800">Centro Médico</h1>
                <p class="text-slate-500 text-sm">Acceso al Sistema Integrado</p>
            </div>
            <div class="space-y-6">
                <!-- Recepción Login -->
                <form onsubmit="loginSecretaria(event)" autocomplete="off" class="border-b pb-4 space-y-3">
                    <h2 class="font-bold text-teal-600 text-sm">Recepción / Secretaría</h2>
                    <input type="text" id="secUsuario" name="username_sec" placeholder="Usuario" autocomplete="off" value="" required class="w-full p-2.5 border rounded text-sm">
                    <input type="password" id="secClave" name="password_sec" placeholder="Contraseña" autocomplete="new-password" value="" required class="w-full p-2.5 border rounded text-sm">
                    <button class="w-full bg-teal-600 hover:bg-teal-700 text-white p-2.5 rounded text-sm font-semibold">Ingresar a Recepción</button>
                </form>

                <!-- Médico Login -->
                <form onsubmit="loginMedico(event)" autocomplete="off" class="border-b pb-4 space-y-3">
                    <h2 class="font-bold text-indigo-600 text-sm">Portal Médico</h2>
                    <input type="text" id="medUsuario" name="username_med" placeholder="Usuario Médico" autocomplete="off" value="" required class="w-full p-2.5 border rounded text-sm">
                    <input type="password" id="medClave" name="password_med" placeholder="Contraseña" autocomplete="new-password" value="" required class="w-full p-2.5 border rounded text-sm">
                    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded text-sm font-semibold">Ingresar al Portal Médico</button>
                </form>

                <!-- Admin Login -->
                <form onsubmit="loginAdmin(event)" autocomplete="off" class="space-y-3">
                    <h2 class="font-bold text-amber-600 text-sm">Administración</h2>
                    <input type="text" id="adminUsuario" name="username_admin" placeholder="Usuario Administrador" autocomplete="off" value="" required class="w-full p-2.5 border rounded text-sm">
                    <input type="password" id="adminClave" name="password_admin" placeholder="Contraseña Master" autocomplete="new-password" value="" required class="w-full p-2.5 border rounded text-sm">
                    <button class="w-full bg-amber-600 hover:bg-amber-700 text-white p-2.5 rounded text-sm font-semibold">Ingresar como Administrador</button>
                </form>
            </div>
        </div>
    </div>`;
}
 

        // --- DASHBOARD ADMIN (MÉTRICAS + CREACIÓN DE MÉDICOS) ---
        function renderDashboardAdmin() {
            const totalTurnos = state.turnos.length;
            const atendidos = state.turnos.filter(t => t.estado === 'Atendido').length;
            const ausentes = state.turnos.filter(t => t.estado === 'Ausente' || t.estado === 'Cancelado').length;

            return `
            <div class="p-6 max-w-6xl mx-auto w-full space-y-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-slate-800">Panel de Administración General</h1>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm">Salir</button>
                </div>
                <!-- MÉTRICAS -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                        <p class="text-slate-500 text-xs font-bold uppercase">Total Turnos Registrados</p>
                        <p class="text-3xl font-extrabold text-slate-800">${totalTurnos}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                        <p class="text-emerald-600 text-xs font-bold uppercase">Pacientes Atendidos</p>
                        <p class="text-3xl font-extrabold text-emerald-600">${atendidos}</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl shadow border border-slate-200">
                        <p class="text-rose-600 text-xs font-bold uppercase">Ausencias / Cancelados</p>
                        <p class="text-3xl font-extrabold text-rose-600">${ausentes}</p>
                    </div>
                </div>
                <!-- REGISTRAR MÉDICO -->
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">Registrar Nuevo Médico / Profesional</h2>
                    <form onsubmit="registrarMedico(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" name="nombre" placeholder="Nombre completo (ej. Dr. Juan Pérez)" required class="p-2.5 border rounded text-sm">
                        <input type="text" name="especialidad" placeholder="Especialidad (ej. Pediatría)" required class="p-2.5 border rounded text-sm">
                        <input type="text" name="usuario" placeholder="Usuario de acceso (ej. drperez)" required class="p-2.5 border rounded text-sm">
                        <input type="password" name="clave" placeholder="Contraseña inicial" required class="p-2.5 border rounded text-sm">
                        <button type="submit" class="md:col-span-2 bg-teal-600 hover:bg-teal-700 text-white p-3 rounded font-semibold text-sm">Guardar Médico</button>
                    </form>
                </div>
                <!-- LISTA DE MÉDICOS -->
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">Médicos Registrados</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 border-b">
                                <tr>
                                    <th class="p-3">Nombre</th>
                                    <th class="p-3">Especialidad</th>
                                    <th class="p-3">Usuario</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${state.medicos.length === 0 ? `<tr><td colspan="3" class="p-4 text-center text-slate-400">No hay médicos registrados.</td></tr>` : 
                                    state.medicos.map(m => `
                                        <tr class="border-b">
                                            <td class="p-3 font-semibold text-slate-800">${m.nombre}</td>
                                            <td class="p-3">${m.especialidad}</td>
                                            <td class="p-3 text-indigo-600 font-mono">${m.usuario}</td>
                                        </tr>
                                    `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        // --- DASHBOARD SECRETARÍA (AGENDA, BÚSQUEDA, WHATSAPP, EXCEL) ---
        function renderDashboardSecretaria() {
            let turnosFiltrados = state.turnos.filter(t => {
                const coincideTexto = t.paciente.toLowerCase().includes(state.filtroTexto.toLowerCase()) || t.dni.includes(state.filtroTexto);
                const coincideEstado = state.filtroEstado === 'Todos' || t.estado === state.filtroEstado;
                return coincideTexto && coincideEstado;
            });

            return `
            <div class="p-6 max-w-7xl mx-auto w-full space-y-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-slate-800">Recepción - Gestión de Turnos</h1>
                    <div class="space-x-2">
                        <button onclick="exportarTurnosCSV()" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm font-semibold">Descargar Excel</button>
                        <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm">Salir</button>
                    </div>
                </div>
                <!-- FORMULARIO DE NUEVO TURNO -->
                <div class="bg-white p-6 rounded-xl shadow border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">Asignar Nuevo Turno</h2>
                    <form onsubmit="guardarTurnoNuevo(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <select name="medico_id" required class="p-2.5 border rounded text-sm">
                            <option value="">Seleccione Médico...</option>
                            ${state.medicos.map(m => `<option value="${m.id}">${m.nombre} (${m.especialidad})</option>`).join('')}
                        </select>
                        <input type="text" name="paciente" placeholder="Nombre completo del paciente" required class="p-2.5 border rounded text-sm">
                        <input type="text" name="dni" placeholder="DNI" required class="p-2.5 border rounded text-sm">
                        <input type="text" name="telefono" placeholder="Teléfono / WhatsApp" required class="p-2.5 border rounded text-sm">
                        <input type="date" name="fecha" required class="p-2.5 border rounded text-sm">
                        <select name="hora" required class="p-2.5 border rounded text-sm">
                            <option value="">Seleccione Hora...</option>
                            ${BLOQUES_HORARIOS.map(h => `<option value="${h}">${h} hs</option>`).join('')}
                        </select>
                        <button type="submit" class="md:col-span-3 bg-teal-600 hover:bg-teal-700 text-white p-3 rounded font-semibold text-sm">Confirmar y Guardar Turno</button>
                    </form>
                </div>
                <!-- FILTROS Y BÚSQUEDA -->
                <div class="bg-white p-4 rounded-xl shadow flex gap-4">
                    <input type="text" placeholder="Buscar por Nombre o DNI..." value="${state.filtroTexto}" oninput="state.filtroTexto=this.value; renderApp();" class="p-2.5 border rounded text-sm flex-grow">
                    <select onchange="state.filtroEstado=this.value; renderApp();" class="p-2.5 border rounded text-sm">
                        <option value="Todos">Todos los estados</option>
                        <option value="En espera">En espera</option>
                        <option value="Atendido">Atendido</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
                <!-- TABLA DE TURNOS -->
                <div class="bg-white rounded-xl shadow overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="p-3">Paciente / DNI</th>
                                <th class="p-3">Fecha y Hora</th>
                                <th class="p-3">Médico Asignado</th>
                                <th class="p-3">Estado</th>
                                <th class="p-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${turnosFiltrados.length === 0 ? `<tr><td colspan="5" class="p-4 text-center text-slate-400">No se encontraron turnos.</td></tr>` :
                                turnosFiltrados.map(t => `
                                    <tr class="border-b hover:bg-slate-50">
                                        <td class="p-3 font-semibold text-slate-800">${t.paciente}<br><span class="text-xs text-slate-400">DNI: ${t.dni}</span></td>
                                        <td class="p-3">${t.fecha} - ${t.hora} hs</td>
                                        <td class="p-3">${t.medicos?.nombre || 'Sin asignar'}</td>
                                        <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-bold ${t.estado==='Atendido'?'bg-emerald-100 text-emerald-700':t.estado==='Cancelado'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}">${t.estado}</span></td>
                                        <td class="p-3 flex gap-2">
                                            <button onclick="enviarWhatsAppConfirmacion(${t.id})" class="bg-green-500 hover:bg-green-600 text-white px-2 py-1 rounded text-xs font-semibold">WhatsApp</button>
                                            <button onclick="cambiarEstadoTurno(${t.id}, 'Cancelado')" class="bg-rose-500 hover:bg-rose-600 text-white px-2 py-1 rounded text-xs">Cancelar</button>
                                        </td>
                                    </tr>
                                `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        // --- DASHBOARD MÉDICO (HISTORIA CLÍNICA) ---
        function renderDashboardMedico() {
            const misTurnos = state.turnos.filter(t => t.medico_id === state.usuarioActual.id);

            return `
            <div class="p-6 max-w-6xl mx-auto w-full space-y-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold text-slate-800">Portal Médico: ${state.usuarioActual.nombre}</h1>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded text-sm">Salir</button>
                </div>
                <div class="space-y-4">
                    ${misTurnos.length === 0 ? `<div class="bg-white p-6 rounded-xl shadow text-center text-slate-400">No tiene turnos asignados actualmente.</div>` :
                        misTurnos.map(t => `
                            <div class="bg-white p-4 rounded-xl shadow border border-slate-200 space-y-3">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <h3 class="font-bold text-slate-800">${t.paciente} (DNI: ${t.dni})</h3>
                                        <p class="text-xs text-slate-500">Fecha: ${t.fecha} - Horario: ${t.hora} hs | Tel: ${t.telefono}</p>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-bold ${t.estado==='Atendido'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${t.estado}</span>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Historia Clínica / Notas de Consulta</label>
                                    <textarea id="nota-${t.id}" placeholder="Escriba el diagnóstico y observaciones clínicas..." class="w-full p-2.5 border rounded text-sm h-24">${t.nota_consulta || ''}</textarea>
                                </div>
                                <button onclick="guardarNotaConsulta(${t.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-xs font-semibold">Guardar Ficha y Marcar Atendido</button>
                            </div>
                        `).join('')}
                </div>
            </div>`;
        }

        // Carga inicial
        document.addEventListener("DOMContentLoaded", () => {
            cargarDatosIniciales();
        });
    </script>
</body>
</html>
